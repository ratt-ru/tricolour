[project]
name = "tricolour"
version = "0.0.0"
description = "A Radio Astronomy Flagging Software Suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Simon Perkins", email = "sperkins@sarao.ac.za" },
    { name = "Benjamin Hugo", email = "bhugo@sarao.ac.za" }
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "hip-cargo>=0.1.3",
    "numba>=0.64.0",
    "numpy>=2.4.2",
]

[project.urls]
Homepage = "https://github.com/ratt-ru/tricolour"
Repository = "https://github.com/ratt-ru/tricolour"
"Bug Tracker" = "https://github.com/ratt-ru/tricolour/issues"

[project.scripts]
tricolour = "tricolour.cli:app"

[build-system]
# NOTE: This uv_build constraint is intentionally aligned with hip-cargo's own pyproject.toml.
# If you bump uv_build in hip-cargo, update this template constraint to match.
requires = ["uv_build>=0.8.3,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = ["saved"]
indent-width = 2
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take more time to run",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "tbump>=6.11.0",
    "pre-commit>=4.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "scipy>=1.17.1",
]
