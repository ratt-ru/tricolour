[project]
name = "tricolour"
version = "0.0.0"
description = "A Radio Astronomy Flagging Software Suite"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
    { name = "Simon Perkins", email = "sperkins@sarao.ac.za" },
    { name = "Benjamin Hugo", email = "bhugo@sarao.ac.za" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "hip-cargo>=0.1.3",
    "msv4-utils>=0.0.2",
    "numba>=0.64.0",
    "numpy>=2.4.2",
    "xarray",
    "ray",
    "ruyaml",
    "donfig",
    "scipy",
    "rarg-ray-patterns>=0.0.2",
    "rarg-python-patterns>=0.0.4",
]

[project.urls]
Homepage = "https://github.com/ratt-ru/tricolour"
Repository = "https://github.com/ratt-ru/tricolour"
"Bug Tracker" = "https://github.com/ratt-ru/tricolour/issues"

[project.scripts]
tricolour = "tricolour.cli:app"

[project.entry-points."xarray.chunkmanagers"]
"tricolour:scaffold" = "tricolour.core.scaffold_array:ScaffoldChunkManager"

[project.optional-dependencies]
msv2 = [
    "xarray-ms >= 0.4.0a3, < 0.5.0",
]
meerkat = [
    "xarray-kat>=0.0.1",
]
zarr = [
    "zarr>=3.1.5",
]
ray = [
    "ray>=2.54.0",
]

[build-system]
# NOTE: This uv_build constraint is intentionally aligned with hip-cargo's own pyproject.toml.
# If you bump uv_build in hip-cargo, update this template constraint to match.
requires = ["uv_build>=0.8.3,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = ["saved"]
indent-width = 2
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take more time to run",
    "acceptance: End-to-end acceptance tests (requires gdown and python-casacore; run via the acceptance workflow)",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "tbump>=6.11.0",
    "pre-commit>=4.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ray[default]>=2.55.1",
    "scipy>=1.17.1",
    "zarr>=3.1.5",
]
